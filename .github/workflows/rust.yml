name: Rust

on:
  push:
    branches: [ "dev", "elimination_of_rc_refcell" ]
  pull_request:
    branches: [ "dev", "elimination_of_rc_refcell" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

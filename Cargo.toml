[package]
name = "kontur-search"
version = "0.1.0"
edition = "2024"


[profile.release]
strip = true  # Automatically strip symbols from the binary.
lto = true
opt-level = 2
codegen-units = 1
panic = "abort"

[dependencies]
clap = { version = "4.5.33", features = ["derive"] }
fxhash = "0.2.1"
mimalloc = { version = "0.1.48", features = ["v3"] }
